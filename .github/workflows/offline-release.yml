name: Offline ReShade maintenance
on:
  push:
    branches: [main, 'feature/offline-reshade-*', 'codex/**']
    tags: ['offline-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
defaults:
  run:
    shell: pwsh
jobs:
  baseline:
    name: Source and interface baseline
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.4'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Check pinned source, contracts and release verifier
        run: |
          python tools/verify_offline_baseline.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/check_workflows.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_maintenance.py -v
      - name: Core protocol and automation regressions
        run: dotnet run --project tests/OfflineReShade.Core.Tests -c Release --nologo
  verify-and-package:
    name: Verified Windows x64 package
    needs: baseline
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.4'
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64
      - name: Build, test and verify release integrity
        run: ./tools/build_offline_release.ps1 -RunIntegrationTests -RequireCleanSource
      - name: Preserve build and regression diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: OfflineReShade-diagnostics-${{ github.run_id }}
          path: |
            build/offline-release/build-*.log
            build/offline-release/verification-*.json
            build/offline-release/**/mcp*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: OfflineReShade-win-x64
          path: |
            build/offline-release/*.zip
            build/offline-release/*.sha256
          if-no-files-found: error
          retention-days: 30
